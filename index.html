<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef2f4; --panel:#fff; --field:#fff; --ink:#14202b; --muted:#5b6b78; --line:#d5dde3; --accent:#0f766e; --on:#fff; --head:#14202b; --hi:#e2f1ef; --warn:#b42318; --aud:#e4f4e8; }
  :root[data-theme=dark] { --bg:#0d1317; --panel:#151d23; --field:#0f161b; --ink:#e6edf1; --muted:#93a4af; --line:#2a3640; --accent:#2dd4bf; --on:#06201d; --head:#0a0f12; --hi:#123a36; --warn:#ff8a7e; --aud:#14301f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 20px; background:var(--head); color:#fff; }
  header h1 { margin:0; font-size:20px; font-weight:600; }
  .hr { display:flex; gap:10px; align-items:center; }
  header input { padding:8px 10px; border-radius:6px; border:1px solid #3a4a58; background:#1f2f3d; color:#fff; width:150px; }
  #themeBtn { width:38px; height:38px; padding:0; display:grid; place-items:center; background:transparent; border:1px solid #4a5a68; color:#fff; }
  #themeBtn svg { width:20px; height:20px; }
  main { display:grid; grid-template-columns:300px 1fr; gap:18px; padding:18px 20px; max-width:1400px; margin:0 auto; }
  aside, .results { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  aside { align-self:start; }
  .ft { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); font-weight:600; }
  .grp { border-bottom:1px solid var(--line); }
  .gh { width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:0; color:var(--muted); padding:12px 14px; font:inherit; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  .gh .car { transition:transform .15s; }
  .grp.open .gh .car { transform:rotate(180deg); }
  .gb { display:none; padding:0 14px 14px; }
  .grp.open .gb { display:block; }
  label.l { display:block; margin:10px 0 4px; font-weight:500; font-size:14px; }
  input[type=text], input[type=number], select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; background:var(--field); color:var(--ink); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .check { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:14px; }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 0; }
  button { font:inherit; cursor:pointer; border-radius:6px; padding:8px 14px; border:1px solid var(--accent); background:var(--accent); color:var(--on); font-weight:500; }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:3px solid #f59e0b; outline-offset:2px; }
  .btns { display:flex; gap:8px; padding:14px; }
  /* multi-select */
  .trig { width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--field); color:var(--ink); border:1px solid var(--line); text-align:left; font-weight:400; }
  .pnl { border:1px solid var(--line); border-radius:6px; margin-top:6px; background:var(--field); }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:0; border-radius:0; background:none; color:var(--muted); padding:8px; }
  .tabs button.on { color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent); }
  .srch { margin:8px; width:calc(100% - 16px) !important; }
  .opts { max-height:220px; overflow:auto; padding:0 8px 8px; }
  .opt { display:flex; align-items:center; gap:8px; padding:6px 2px; font-size:14px; cursor:pointer; }
  .opt span { flex:1; word-break:break-word; }
  .opt em { font-style:normal; color:var(--muted); font-size:12px; }
  /* results */
  .results { padding:16px; min-width:0; }
  .bar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:900px; table-layout:fixed; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  th:nth-child(1) { width:17%; } th:nth-child(2) { width:21%; } th:nth-child(3) { width:10%; } th:nth-child(4) { width:13%; } th:nth-child(5) { width:14%; } th:nth-child(6) { width:11%; } th:nth-child(7) { width:14%; }
  th { color:var(--muted); font-weight:500; }
  td a { color:var(--accent); text-decoration:none; font-weight:500; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; background:var(--hi); color:var(--accent); font-size:11px; margin:0 4px 0 0; }
  .muted { color:var(--muted); }
  .msg { padding:24px 8px; color:var(--muted); }
  .msg.error { color:var(--warn); }
  .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; }
  /* store name, eye and audit buttons */
  .dom { background:none; border:0; padding:0; color:var(--accent); font:inherit; font-weight:500; cursor:pointer; text-align:left; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dom:hover { text-decoration:underline; }
  .acts { display:flex; gap:6px; align-items:center; }
  .ibtn { width:32px; height:32px; padding:0; display:grid; place-items:center; background:transparent; color:var(--accent); border:1px solid var(--line); flex:none; }
  .ibtn svg { width:17px; height:17px; }
  a.abtn { display:inline-block; padding:5px 10px; border:1px solid var(--accent); border-radius:6px; color:var(--accent); font-size:12px; font-weight:600; text-decoration:none; white-space:nowrap; flex:none; }
  tr.aud td { background:var(--aud); }
  tr.aud a.abtn { background:var(--accent); color:var(--on); }
  /* popup */
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:center; padding:6vh 12px; overflow:auto; z-index:50; }
  .mod { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:12px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .mh { display:flex; justify-content:space-between; gap:10px; padding:18px 20px 12px; }
  .mh h2 { margin:0; font-size:20px; font-weight:600; word-break:break-all; }
  .mh .nav { display:flex; gap:4px; flex:none; }
  .mh .nav button { width:34px; height:34px; padding:0; display:grid; place-items:center; background:transparent; color:var(--ink); border:1px solid var(--line); }
  .mh .nav svg { width:16px; height:16px; }
  .mstat { padding:0 20px 14px; color:var(--muted); font-size:14px; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; }
  .mstat b { color:var(--ink); }
  .mtabs { display:flex; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:0 12px; overflow-x:auto; }
  .mtabs button { border:0; border-radius:0; background:none; color:var(--muted); padding:11px 10px; white-space:nowrap; }
  .mtabs button.on { color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent); font-weight:600; }
  .mb { padding:6px 20px 14px; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .kv span { color:var(--muted); }
  .kv.col { grid-template-columns:1fr; gap:4px; }
  .kv.col b { font-weight:400; line-height:1.5; }
  .pg { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .kv b { font-weight:500; word-break:break-word; }
  .kv a { color:var(--accent); }
  .li { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; }
  .li button { padding:3px 10px; font-size:12px; }
  .mf { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 20px 18px; border-top:1px solid var(--line); }
  .mf a.abtn { padding:8px 14px; font-size:14px; }
  .mf .note { color:var(--muted); font-size:13px; flex:1; min-width:120px; }
  [hidden] { display:none !important; }
  @media (max-width:820px) { main { grid-template-columns:1fr; padding:12px; } header input { width:110px; } }
</style>
</head>
<body>
<header>
  <h1>Store Finder</h1>
  <div class="hr">
    <input id="key" type="password" placeholder="Access key" aria-label="Access key">
    <button id="themeBtn" type="button" aria-label="Switch to dark mode">
      <svg id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <aside>
    <div class="ft">Filters <button id="reset" class="ghost" type="button" style="padding:4px 10px">Reset</button></div>

    <section class="grp open"><button class="gh" type="button">Basics <span class="car">&#9662;</span></button><div class="gb">
      <label class="l">Platform</label><div id="ms-platform"></div>
      <label class="l">Country</label><div id="ms-country"></div>
      <label class="l">Category</label><div id="ms-category"></div>
    </div></section>

    <section class="grp"><button class="gh" type="button">Products <span class="car">&#9662;</span></button><div class="gb">
      <label class="l">Product count</label>
      <div class="row2"><input type="number" id="product_min" placeholder="Min" min="0"><input type="number" id="product_max" placeholder="Max" min="0"></div>
      <p class="hint">Only Shopify stores report this (up to 250).</p>
    </div></section>

    <section class="grp"><button class="gh" type="button">Contact &amp; social <span class="car">&#9662;</span></button><div class="gb">
      <label class="check"><input type="checkbox" id="has_email"> Has email</label>
      <label class="check"><input type="checkbox" id="has_phone"> Has phone</label>
      <label class="l">Social platforms</label><div id="ms-social"></div>
    </div></section>

    <section class="grp"><button class="gh" type="button">Advertising <span class="car">&#9662;</span></button><div class="gb">
      <label class="l" for="pixel">Meta Pixel (likely runs ads)</label>
      <select id="pixel"><option value="">Any</option><option value="1">Has Meta Pixel</option><option value="0">No Meta Pixel</option></select>
    </div></section>

    <section class="grp"><button class="gh" type="button">Technologies &amp; apps <span class="car">&#9662;</span></button><div class="gb">
      <label class="l" for="klaviyo">Klaviyo</label>
      <select id="klaviyo"><option value="">Any</option><option value="1">Uses Klaviyo</option><option value="0">Does not use Klaviyo</option></select>
    </div></section>

    <section class="grp"><button class="gh" type="button">Domain <span class="car">&#9662;</span></button><div class="gb">
      <label class="l" for="q">Name or domain contains</label>
      <input type="text" id="q" placeholder="e.g. beauty">
      <label class="check"><input type="checkbox" id="active"> Active stores only</label>
    </div></section>

    <div class="btns"><button id="search" type="button" style="flex:1">Search</button></div>
  </aside>

  <section class="results">
    <div class="bar">
      <strong id="count">No search yet</strong>
      <label class="check" style="margin:0"><input type="checkbox" id="hideAud"> Hide audited stores</label>
      <button id="export" class="ghost" type="button" disabled>Export CSV</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Name</th><th>Store</th><th>Platform</th><th>Country</th><th>Category</th><th>Signals</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="msg" class="msg">Enter your access key, then press Search.</div>
    <div class="pager">
      <button id="prev" class="ghost" type="button" disabled>Previous</button>
      <span id="page" class="muted"></span>
      <button id="next" class="ghost" type="button" disabled>Next</button>
    </div>
  </section>
</main>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="Store details"><div class="mod" id="mod"></div></div>

<script>
// IMPORTANT: keep your real site-audit address here. The domain is added to the end.
const AUDIT_URL = 'https://site-audit-rose.vercel.app/?url=';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const keyInput = $('key');
let page = 1;

/* ---------- theme ---------- */
function applyTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('moon').hidden = dark; $('sun').hidden = !dark;
  $('themeBtn').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
let dark = false;
try { const s = localStorage.getItem('sf_dark'); dark = s === null ? matchMedia('(prefers-color-scheme: dark)').matches : s === '1'; } catch (e) {}
applyTheme(dark);
$('themeBtn').onclick = () => { dark = !dark; applyTheme(dark); try { localStorage.setItem('sf_dark', dark ? '1' : '0'); } catch (e) {} };

/* ---------- access key ---------- */
try { keyInput.value = localStorage.getItem('sf_key') || ''; } catch (e) {}
keyInput.addEventListener('change', () => { try { localStorage.setItem('sf_key', keyInput.value); } catch (e) {} loadFilters(); });

/* ---------- collapsible sections ---------- */
document.querySelectorAll('.gh').forEach((b) => b.onclick = () => b.parentElement.classList.toggle('open'));

/* ---------- multi-select with Include / Exclude, search and counts ---------- */
const ms = {};
function makeMS(id) {
  const el = $('ms-' + id);
  const st = ms[id] = { inc: new Set(), exc: new Set(), items: [], tab: 'inc', q: '' };
  el.innerHTML = '<button type="button" class="trig"><span class="sum">Any</span><span>&#9662;</span></button>'
    + '<div class="pnl" hidden><div class="tabs"><button type="button" data-t="inc" class="on">Include</button><button type="button" data-t="exc">Exclude</button></div>'
    + '<input type="text" class="srch" placeholder="Search..." aria-label="Search options"><div class="opts"></div></div>';
  const pnl = el.querySelector('.pnl');
  el.querySelector('.trig').onclick = () => { pnl.hidden = !pnl.hidden; };
  el.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
    st.tab = b.dataset.t;
    el.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    drawMS(id);
  });
  el.querySelector('.srch').oninput = (e) => { st.q = e.target.value.toLowerCase(); drawMS(id); };
  el.querySelector('.opts').onchange = (e) => {
    const v = e.target.dataset.v, mine = st[st.tab], other = st[st.tab === 'inc' ? 'exc' : 'inc'];
    if (e.target.checked) { mine.add(v); other.delete(v); } else mine.delete(v);
    drawMS(id);
  };
  drawMS(id);
}
function drawMS(id) {
  const st = ms[id], el = $('ms-' + id), set = st[st.tab];
  el.querySelector('.opts').innerHTML = st.items.filter((i) => i.label.toLowerCase().includes(st.q)).map((i) =>
    '<label class="opt"><input type="checkbox" data-v="' + esc(i.v) + '"' + (set.has(i.v) ? ' checked' : '') + '><span>' + esc(i.label) + '</span><em>' + i.n.toLocaleString() + '</em></label>'
  ).join('') || '<div class="hint" style="padding:8px">No options yet.</div>';
  const parts = [];
  if (st.inc.size) parts.push(st.inc.size + ' included');
  if (st.exc.size) parts.push(st.exc.size + ' excluded');
  el.querySelector('.sum').textContent = parts.join(', ') || 'Any';
}
['platform', 'country', 'category', 'social'].forEach(makeMS);

const PLATFORMS = ['Shopify', 'WooCommerce', 'Wix', 'PrestaShop', 'BigCommerce', 'Magento'];
async function loadFilters() {
  if (!keyInput.value) return;
  try {
    const r = await fetch('/api/filters', { headers: { 'x-access-key': keyInput.value } });
    if (!r.ok) return;
    const d = await r.json();
    const counts = Object.fromEntries(d.platforms.map((p) => [p.v, p.n]));
    const extra = d.platforms.map((p) => p.v).filter((v) => !PLATFORMS.includes(v));
    ms.platform.items = PLATFORMS.concat(extra).map((v) => ({ v, label: v, n: counts[v] || 0 }));
    ms.country.items = d.countries.map((c) => ({ v: c.v, label: c.v, n: c.n }));
    ms.category.items = d.categories.map((c) => ({ v: c.v, label: c.v, n: c.n }));
    ms.social.items = [['instagram', 'Instagram'], ['facebook', 'Facebook'], ['tiktok', 'TikTok']].map(([v, label]) => ({ v, label, n: d.socials[v] || 0 }));
    Object.keys(ms).forEach(drawMS);
  } catch (e) { /* options stay empty, search still works */ }
}

/* ---------- search ---------- */
function params() {
  const p = new URLSearchParams();
  for (const id in ms) {
    ms[id].inc.forEach((v) => p.append(id + '_in', v));
    ms[id].exc.forEach((v) => p.append(id + '_ex', v));
  }
  ['q', 'klaviyo', 'pixel', 'product_min', 'product_max'].forEach((id) => { const v = $(id).value.trim(); if (v) p.set(id, v); });
  ['has_email', 'has_phone', 'active'].forEach((id) => { if ($(id).checked) p.set(id, '1'); });
  return p;
}
function setMsg(text, isError) {
  $('msg').textContent = text;
  $('msg').className = 'msg' + (isError ? ' error' : '');
  $('msg').style.display = text ? 'block' : 'none';
}
async function run(goTo) {
  page = goTo;
  const p = params(); p.set('page', page);
  setMsg('Searching...'); $('rows').innerHTML = '';
  try {
    const r = await fetch('/api/search?' + p, { headers: { 'x-access-key': keyInput.value } });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Search failed.');
    render(data);
    if (!ms.platform.items.length) loadFilters();
  } catch (e) { setMsg(e.message, true); }
}
/* ---------- audited stores (remembered on this device) ---------- */
const dkey = (d) => String(d || '').toLowerCase().replace(/^www\./, '');
function audMap() { try { return JSON.parse(localStorage.getItem('sf_audited') || '{}'); } catch (e) { return {}; } }
const audAt = (d) => audMap()[dkey(d)] || 0;
const isAud = (d) => Boolean(audAt(d));
function saveAud(m) { try { localStorage.setItem('sf_audited', JSON.stringify(m)); } catch (e) {} }
function paintAud() {
  document.querySelectorAll('#rows tr').forEach((tr) => {
    const on = isAud(tr.dataset.d);
    tr.classList.toggle('aud', on);
    const a = tr.querySelector('a.abtn'); if (a) a.innerHTML = on ? 'Audited &#10003;' : 'Audit';
  });
  if (!$('ov').hidden) drawM();
}
function markAud(d) { const m = audMap(); if (!m[dkey(d)]) { m[dkey(d)] = Date.now(); saveAud(m); } paintAud(); }
function clearAud(d) { const m = audMap(); delete m[dkey(d)]; saveAud(m); paintAud(); }

/* ---------- results ---------- */
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const auditHref = (d) => AUDIT_URL + encodeURIComponent(d);
let LAST = { rows: [], count: 0, limit: 30 }, ROWS = [], cur = -1, tab = 'ov', lastFocus = null;

function render(d) {
  LAST = d;
  const pages = Math.max(1, Math.ceil(d.count / d.limit));
  $('export').disabled = d.count === 0;
  $('page').textContent = 'Page ' + page + ' of ' + pages;
  $('prev').disabled = page <= 1; $('next').disabled = page >= pages;
  drawRows();
}
function drawRows() {
  const hide = $('hideAud').checked;
  ROWS = LAST.rows.filter((s) => !(hide && isAud(s.domain)));
  const hidden = LAST.rows.length - ROWS.length;
  $('count').textContent = LAST.count.toLocaleString() + ' stores found' + (hidden ? ' (' + hidden + ' audited hidden)' : '');
  if (!LAST.rows.length) { $('rows').innerHTML = ''; setMsg('No stores match these filters. Remove a filter or add more stores.'); return; }
  if (!ROWS.length) { $('rows').innerHTML = ''; setMsg('Every store on this page is already audited. Try the next page.'); return; }
  setMsg('');
  $('rows').innerHTML = ROWS.map((s, i) => {
    const on = isAud(s.domain);
    const signals = (s.uses_klaviyo ? '<span class="tag">Klaviyo</span>' : '') + (s.has_meta_pixel ? '<span class="tag">Meta Pixel</span>' : '');
    return '<tr class="' + (on ? 'aud' : '') + '" data-d="' + esc(s.domain) + '">'
      + '<td title="' + esc(s.site_name) + '">' + (s.site_name ? esc(s.site_name) : '<span class="muted">-</span>') + '</td>'
      + '<td><button type="button" class="dom" data-i="' + i + '" title="' + esc(s.domain) + '">' + esc(s.domain) + '</button></td>'
      + '<td>' + esc(s.platform) + '</td><td>' + esc(s.country) + '</td><td>' + esc(s.category) + '</td>'
      + '<td>' + signals + '</td>'
      + '<td><div class="acts"><button type="button" class="ibtn" data-i="' + i + '" aria-label="View details for ' + esc(s.domain) + '" title="View details">' + EYE + '</button>'
      + '<a class="abtn" data-d="' + esc(s.domain) + '" href="' + AUDIT_URL + encodeURIComponent(s.domain) + '" target="_blank" rel="noopener">' + (on ? 'Audited &#10003;' : 'Audit') + '</a></div></td></tr>';
  }).join('');
}
$('hideAud').onchange = drawRows;
$('rows').addEventListener('click', (e) => {
  const o = e.target.closest('[data-i]');
  if (o) { lastFocus = o; openM(+o.dataset.i); return; }
  const a = e.target.closest('a.abtn'); if (a) markAud(a.dataset.d);
});

/* ---------- popup ---------- */
const fmt = (d) => d ? new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const prod = (s) => s.total_products != null ? s.total_products.toLocaleString() : s.product_count != null ? (s.product_count >= 250 ? '250+' : String(s.product_count)) : '';
const kvc = (k, v) => '<div class="kv col"><span>' + esc(k) + '</span><b>' + (v ? esc(v) : '<span>Not found</span>') + '</b></div>';
const kv = (k, v) => '<div class="kv"><span>' + esc(k) + '</span><b>' + (v ? esc(v) : '<span>Not found</span>') + '</b></div>';
const li = (v) => '<div class="li"><span>' + esc(v) + '</span><button type="button" class="ghost" data-a="copy" data-v="' + esc(v) + '">Copy</button></div>';
const CH = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
function openM(i) { cur = i; tab = 'ov'; drawM(); $('ov').hidden = false; document.body.style.overflow = 'hidden'; const x = $('mod').querySelector('[data-a=x]'); if (x) x.focus(); }
function closeM() { $('ov').hidden = true; document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); }
function go(n) { const k = cur + n; if (k >= 0 && k < ROWS.length) { cur = k; tab = tab; drawM(); $('ov').scrollTop = 0; } }
function drawM() {
  const s = ROWS[cur]; if (!s) return;
  const at = audAt(s.domain), emails = s.emails || [], phones = s.phones || [];
  const socials = [['Instagram', s.instagram], ['Facebook', s.facebook], ['TikTok', s.tiktok]].filter((x) => x[1]);
  let body = '';
  if (tab === 'ov') {
    const pg = s.pages ? Object.keys(s.pages).map((k) => '<a href="' + esc(s.pages[k]) + '" target="_blank" rel="noopener">' + k.charAt(0).toUpperCase() + k.slice(1) + '</a>').join('') : '';
    body = kvc('Title', s.title) + kvc('Description', s.description)
      + kv('Category', s.category) + kv('Platform', s.platform) + kv('Language', s.language)
      + kv('Country', s.country) + kv('Location', s.location) + kv('Currency', s.currency)
      + kv('Products', prod(s)) + kv('Status', s.is_active === false ? 'Site not loading' : 'Active')
      + '<div class="kv"><span>Pages</span><div class="pg">' + (pg || '<span class="muted">None found</span>') + '</div></div>'
      + kv('First seen', fmt(s.created_at)) + kv('Last checked', fmt(s.last_crawled));
  } else if (tab === 'ct') {
    body = '<div class="kv"><span>Emails</span><div>' + (emails.length ? emails.map(li).join('') : '<span class="muted">No email found</span>') + '</div></div>'
      + '<div class="kv"><span>Phones</span><div>' + (phones.length ? phones.map(li).join('') : '<span class="muted">No phone found</span>') + '</div></div>'
      + '<div class="kv"><span>Social</span><div>' + (socials.length ? socials.map((x) => '<div class="li"><a href="' + esc(x[1]) + '" target="_blank" rel="noopener">' + x[0] + '</a></div>').join('') : '<span class="muted">No social links found</span>') + '</div></div>';
  } else {
    body = kv('Klaviyo', s.uses_klaviyo ? 'Yes, already uses Klaviyo' : 'Not detected')
      + kv('Meta Pixel', s.has_meta_pixel ? 'Yes, likely runs Meta ads' : 'Not detected');
  }
  const T = (id, label) => '<button type="button" data-a="tab" data-t="' + id + '" class="' + (tab === id ? 'on' : '') + '">' + label + '</button>';
  $('mod').innerHTML =
    '<div class="mh"><div><h2>' + esc(s.site_name || s.domain) + '</h2>'
    + '<div class="muted" style="margin:2px 0 6px">' + esc(s.domain) + ' <button type="button" class="ghost" data-a="copy" data-v="' + esc(s.domain) + '" style="padding:1px 8px;font-size:12px;margin-left:4px">Copy</button></div>'
    + '<span class="tag">' + esc(s.platform || 'Unknown platform') + '</span></div>'
    + '<div class="nav"><button type="button" data-a="prev" aria-label="Previous store"' + (cur <= 0 ? ' disabled' : '') + '>' + CH('M18 15l-6-6-6 6') + '</button>'
    + '<button type="button" data-a="next" aria-label="Next store"' + (cur >= ROWS.length - 1 ? ' disabled' : '') + '>' + CH('M6 9l6 6 6-6') + '</button>'
    + '<button type="button" data-a="x" aria-label="Close">' + CH('M18 6L6 18M6 6l12 12') + '</button></div></div>'
    + '<div class="mstat">' + (prod(s) ? '<span><b>' + prod(s) + '</b> products</span>' : '')
    + (s.country ? '<span>' + esc(s.country) + '</span>' : '') + (emails.length ? '<span><b>' + emails.length + '</b> email' + (emails.length > 1 ? 's' : '') + '</span>' : '') + '</div>'
    + '<div class="mtabs">' + T('ov', 'Overview') + T('ct', 'Contact &amp; Social') + T('te', 'Tech') + '</div>'
    + '<div class="mb">' + body + '</div>'
    + '<div class="mf"><a class="abtn" data-d="' + esc(s.domain) + '" href="' + auditHref(s.domain) + '" target="_blank" rel="noopener">' + (at ? 'Audited &#10003; (open again)' : 'Audit this store') + '</a>'
    + '<a class="abtn" style="background:transparent;color:var(--accent)" href="https://' + esc(s.domain) + '" target="_blank" rel="noopener">Visit site</a>'
    + (at ? '<span class="note">Audited on ' + esc(fmt(at)) + '. <button type="button" class="ghost" data-a="clear" style="padding:2px 8px;font-size:12px">Clear mark</button></span>' : '') + '</div>';
}
$('mod').addEventListener('click', (e) => {
  const au = e.target.closest('a.abtn'); if (au && au.dataset.d) { markAud(au.dataset.d); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'x') closeM();
  else if (a === 'prev') go(-1);
  else if (a === 'next') go(1);
  else if (a === 'tab') { tab = b.dataset.t; drawM(); }
  else if (a === 'clear') clearAud(ROWS[cur].domain);
  else if (a === 'copy') {
    const t = b.textContent;
    const done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = t; }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.v).then(done, () => {}); else prompt('Copy this:', b.dataset.v);
  }
});
$('ov').addEventListener('click', (e) => { if (e.target === $('ov')) closeM(); });
document.addEventListener('keydown', (e) => {
  if ($('ov').hidden) return;
  if (e.key === 'Escape') closeM();
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
});
async function exportCsv() {
  $('export').disabled = true;
  try {
    const r = await fetch('/api/export?' + params(), { headers: { 'x-access-key': keyInput.value } });
    if (!r.ok) throw new Error((await r.json()).error || 'Export failed.');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob()); a.download = 'stores.csv'; a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { setMsg(e.message, true); }
  $('export').disabled = false;
}
$('search').onclick = () => run(1);
$('prev').onclick = () => run(page - 1);
$('next').onclick = () => run(page + 1);
$('export').onclick = exportCsv;
$('reset').onclick = () => {
  for (const id in ms) { ms[id].inc.clear(); ms[id].exc.clear(); drawMS(id); }
  document.querySelectorAll('aside input[type=text], aside input[type=number], aside select').forEach((el) => { if (!el.classList.contains('srch')) el.value = ''; });
  document.querySelectorAll('aside input[type=checkbox]').forEach((el) => { if (!el.dataset.v) el.checked = false; });
};
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(1); });

loadFilters();
if (keyInput.value) run(1);
</script>
</body>
</html>
