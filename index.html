<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef2f4; --panel:#fff; --field:#fff; --ink:#14202b; --muted:#5b6b78; --line:#d5dde3; --accent:#0f766e; --on:#fff; --head:#14202b; --hi:#e2f1ef; --warn:#b42318; }
  :root[data-theme=dark] { --bg:#0d1317; --panel:#151d23; --field:#0f161b; --ink:#e6edf1; --muted:#93a4af; --line:#2a3640; --accent:#2dd4bf; --on:#06201d; --head:#0a0f12; --hi:#123a36; --warn:#ff8a7e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 20px; background:var(--head); color:#fff; }
  header h1 { margin:0; font-size:20px; font-weight:600; }
  .hr { display:flex; gap:10px; align-items:center; }
  header input { padding:8px 10px; border-radius:6px; border:1px solid #3a4a58; background:#1f2f3d; color:#fff; width:150px; }
  #themeBtn { width:38px; height:38px; padding:0; display:grid; place-items:center; background:transparent; border:1px solid #4a5a68; color:#fff; }
  #themeBtn svg { width:20px; height:20px; }
  main { display:grid; grid-template-columns:300px 1fr; gap:18px; padding:18px 20px; max-width:1400px; margin:0 auto; }
  aside, .results { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  aside { align-self:start; }
  .ft { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); font-weight:600; }
  .grp { border-bottom:1px solid var(--line); }
  .gh { width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:0; color:var(--muted); padding:12px 14px; font:inherit; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  .gh .car { transition:transform .15s; }
  .grp.open .gh .car { transform:rotate(180deg); }
  .gb { display:none; padding:0 14px 14px; }
  .grp.open .gb { display:block; }
  label.l { display:block; margin:10px 0 4px; font-weight:500; font-size:14px; }
  input[type=text], input[type=number], select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; background:var(--field); color:var(--ink); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .check { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:14px; }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 0; }
  button { font:inherit; cursor:pointer; border-radius:6px; padding:8px 14px; border:1px solid var(--accent); background:var(--accent); color:var(--on); font-weight:500; }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:3px solid #f59e0b; outline-offset:2px; }
  .btns { display:flex; gap:8px; padding:14px; }
  /* multi-select */
  .trig { width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--field); color:var(--ink); border:1px solid var(--line); text-align:left; font-weight:400; }
  .pnl { border:1px solid var(--line); border-radius:6px; margin-top:6px; background:var(--field); }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:0; border-radius:0; background:none; color:var(--muted); padding:8px; }
  .tabs button.on { color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent); }
  .srch { margin:8px; width:calc(100% - 16px) !important; }
  .opts { max-height:220px; overflow:auto; padding:0 8px 8px; }
  .opt { display:flex; align-items:center; gap:8px; padding:6px 2px; font-size:14px; cursor:pointer; }
  .opt span { flex:1; word-break:break-word; }
  .opt em { font-style:normal; color:var(--muted); font-size:12px; }
  /* results */
  .results { padding:16px; min-width:0; }
  .bar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:760px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
  th { color:var(--muted); font-weight:500; }
  td a { color:var(--accent); text-decoration:none; font-weight:500; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; background:var(--hi); color:var(--accent); font-size:12px; margin:0 4px 4px 0; }
  .muted { color:var(--muted); }
  .msg { padding:24px 8px; color:var(--muted); }
  .msg.error { color:var(--warn); }
  .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; }
  [hidden] { display:none !important; }
  @media (max-width:820px) { main { grid-template-columns:1fr; padding:12px; } header input { width:110px; } }
</style>
</head>
<body>
<header>
  <h1>Store Finder</h1>
  <div class="hr">
    <input id="key" type="password" placeholder="Access key" aria-label="Access key">
    <button id="themeBtn" type="button" aria-label="Switch to dark mode">
      <svg id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <aside>
    <div class="ft">Filters <button id="reset" class="ghost" type="button" style="padding:4px 10px">Reset</button></div>

    <section class="grp open"><button class="gh" type="button">Basics <span class="car">&#9662;</span></button><div class="gb">
      <label class="l">Platform</label><div id="ms-platform"></div>
      <label class="l">Country</label><div id="ms-country"></div>
      <label class="l">Category</label><div id="ms-category"></div>
    </div></section>

    <section class="grp"><button class="gh" type="button">Products <span class="car">&#9662;</span></button><div class="gb">
      <label class="l">Product count</label>
      <div class="row2"><input type="number" id="product_min" placeholder="Min" min="0"><input type="number" id="product_max" placeholder="Max" min="0"></div>
      <p class="hint">Only Shopify stores report this (up to 250).</p>
    </div></section>

    <section class="grp"><button class="gh" type="button">Contact &amp; social <span class="car">&#9662;</span></button><div class="gb">
      <label class="check"><input type="checkbox" id="has_email"> Has email</label>
      <label class="check"><input type="checkbox" id="has_phone"> Has phone</label>
      <label class="l">Social platforms</label><div id="ms-social"></div>
    </div></section>

    <section class="grp"><button class="gh" type="button">Advertising <span class="car">&#9662;</span></button><div class="gb">
      <label class="l" for="pixel">Meta Pixel (likely runs ads)</label>
      <select id="pixel"><option value="">Any</option><option value="1">Has Meta Pixel</option><option value="0">No Meta Pixel</option></select>
    </div></section>

    <section class="grp"><button class="gh" type="button">Technologies &amp; apps <span class="car">&#9662;</span></button><div class="gb">
      <label class="l" for="klaviyo">Klaviyo</label>
      <select id="klaviyo"><option value="">Any</option><option value="1">Uses Klaviyo</option><option value="0">Does not use Klaviyo</option></select>
    </div></section>

    <section class="grp"><button class="gh" type="button">Domain <span class="car">&#9662;</span></button><div class="gb">
      <label class="l" for="q">Domain contains</label>
      <input type="text" id="q" placeholder="e.g. beauty">
      <label class="check"><input type="checkbox" id="active"> Active stores only</label>
    </div></section>

    <div class="btns"><button id="search" type="button" style="flex:1">Search</button></div>
  </aside>

  <section class="results">
    <div class="bar">
      <strong id="count">No search yet</strong>
      <button id="export" class="ghost" type="button" disabled>Export CSV</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Store</th><th>Platform</th><th>Country</th><th>Category</th><th>Contact</th><th>Signals</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="msg" class="msg">Enter your access key, then press Search.</div>
    <div class="pager">
      <button id="prev" class="ghost" type="button" disabled>Previous</button>
      <span id="page" class="muted"></span>
      <button id="next" class="ghost" type="button" disabled>Next</button>
    </div>
  </section>
</main>

<script>
// IMPORTANT: keep your real site-audit address here. The domain is added to the end.
const AUDIT_URL = 'https://site-audit-rose.vercel.app/?url=';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const keyInput = $('key');
let page = 1;

/* ---------- theme ---------- */
function applyTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('moon').hidden = dark; $('sun').hidden = !dark;
  $('themeBtn').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
let dark = false;
try { const s = localStorage.getItem('sf_dark'); dark = s === null ? matchMedia('(prefers-color-scheme: dark)').matches : s === '1'; } catch (e) {}
applyTheme(dark);
$('themeBtn').onclick = () => { dark = !dark; applyTheme(dark); try { localStorage.setItem('sf_dark', dark ? '1' : '0'); } catch (e) {} };

/* ---------- access key ---------- */
try { keyInput.value = localStorage.getItem('sf_key') || ''; } catch (e) {}
keyInput.addEventListener('change', () => { try { localStorage.setItem('sf_key', keyInput.value); } catch (e) {} loadFilters(); });

/* ---------- collapsible sections ---------- */
document.querySelectorAll('.gh').forEach((b) => b.onclick = () => b.parentElement.classList.toggle('open'));

/* ---------- multi-select with Include / Exclude, search and counts ---------- */
const ms = {};
function makeMS(id) {
  const el = $('ms-' + id);
  const st = ms[id] = { inc: new Set(), exc: new Set(), items: [], tab: 'inc', q: '' };
  el.innerHTML = '<button type="button" class="trig"><span class="sum">Any</span><span>&#9662;</span></button>'
    + '<div class="pnl" hidden><div class="tabs"><button type="button" data-t="inc" class="on">Include</button><button type="button" data-t="exc">Exclude</button></div>'
    + '<input type="text" class="srch" placeholder="Search..." aria-label="Search options"><div class="opts"></div></div>';
  const pnl = el.querySelector('.pnl');
  el.querySelector('.trig').onclick = () => { pnl.hidden = !pnl.hidden; };
  el.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
    st.tab = b.dataset.t;
    el.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    drawMS(id);
  });
  el.querySelector('.srch').oninput = (e) => { st.q = e.target.value.toLowerCase(); drawMS(id); };
  el.querySelector('.opts').onchange = (e) => {
    const v = e.target.dataset.v, mine = st[st.tab], other = st[st.tab === 'inc' ? 'exc' : 'inc'];
    if (e.target.checked) { mine.add(v); other.delete(v); } else mine.delete(v);
    drawMS(id);
  };
  drawMS(id);
}
function drawMS(id) {
  const st = ms[id], el = $('ms-' + id), set = st[st.tab];
  el.querySelector('.opts').innerHTML = st.items.filter((i) => i.label.toLowerCase().includes(st.q)).map((i) =>
    '<label class="opt"><input type="checkbox" data-v="' + esc(i.v) + '"' + (set.has(i.v) ? ' checked' : '') + '><span>' + esc(i.label) + '</span><em>' + i.n.toLocaleString() + '</em></label>'
  ).join('') || '<div class="hint" style="padding:8px">No options yet.</div>';
  const parts = [];
  if (st.inc.size) parts.push(st.inc.size + ' included');
  if (st.exc.size) parts.push(st.exc.size + ' excluded');
  el.querySelector('.sum').textContent = parts.join(', ') || 'Any';
}
['platform', 'country', 'category', 'social'].forEach(makeMS);

const PLATFORMS = ['Shopify', 'WooCommerce', 'Wix', 'PrestaShop', 'BigCommerce', 'Magento'];
async function loadFilters() {
  if (!keyInput.value) return;
  try {
    const r = await fetch('/api/filters', { headers: { 'x-access-key': keyInput.value } });
    if (!r.ok) return;
    const d = await r.json();
    const counts = Object.fromEntries(d.platforms.map((p) => [p.v, p.n]));
    const extra = d.platforms.map((p) => p.v).filter((v) => !PLATFORMS.includes(v));
    ms.platform.items = PLATFORMS.concat(extra).map((v) => ({ v, label: v, n: counts[v] || 0 }));
    ms.country.items = d.countries.map((c) => ({ v: c.v, label: c.v, n: c.n }));
    ms.category.items = d.categories.map((c) => ({ v: c.v, label: c.v, n: c.n }));
    ms.social.items = [['instagram', 'Instagram'], ['facebook', 'Facebook'], ['tiktok', 'TikTok']].map(([v, label]) => ({ v, label, n: d.socials[v] || 0 }));
    Object.keys(ms).forEach(drawMS);
  } catch (e) { /* options stay empty, search still works */ }
}

/* ---------- search ---------- */
function params() {
  const p = new URLSearchParams();
  for (const id in ms) {
    ms[id].inc.forEach((v) => p.append(id + '_in', v));
    ms[id].exc.forEach((v) => p.append(id + '_ex', v));
  }
  ['q', 'klaviyo', 'pixel', 'product_min', 'product_max'].forEach((id) => { const v = $(id).value.trim(); if (v) p.set(id, v); });
  ['has_email', 'has_phone', 'active'].forEach((id) => { if ($(id).checked) p.set(id, '1'); });
  return p;
}
function setMsg(text, isError) {
  $('msg').textContent = text;
  $('msg').className = 'msg' + (isError ? ' error' : '');
  $('msg').style.display = text ? 'block' : 'none';
}
async function run(goTo) {
  page = goTo;
  const p = params(); p.set('page', page);
  setMsg('Searching...'); $('rows').innerHTML = '';
  try {
    const r = await fetch('/api/search?' + p, { headers: { 'x-access-key': keyInput.value } });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Search failed.');
    render(data);
    if (!ms.platform.items.length) loadFilters();
  } catch (e) { setMsg(e.message, true); }
}
function render({ rows, count, limit }) {
  const pages = Math.max(1, Math.ceil(count / limit));
  $('count').textContent = count.toLocaleString() + ' stores found';
  $('export').disabled = count === 0;
  $('page').textContent = 'Page ' + page + ' of ' + pages;
  $('prev').disabled = page <= 1; $('next').disabled = page >= pages;
  if (!rows.length) { setMsg('No stores match these filters. Remove a filter or add more stores.'); return; }
  setMsg('');
  $('rows').innerHTML = rows.map((s) => {
    const contact = [
      ...(s.emails || []).slice(0, 2).map(esc),
      ...(s.phones || []).slice(0, 1).map(esc),
      s.instagram ? '<a href="' + esc(s.instagram) + '" target="_blank" rel="noopener">Instagram</a>' : '',
    ].filter(Boolean).join('<br>') || '<span class="muted">None found</span>';
    const signals = (s.uses_klaviyo ? '<span class="tag">Klaviyo</span>' : '') + (s.has_meta_pixel ? '<span class="tag">Meta Pixel</span>' : '');
    return '<tr><td><a href="https://' + esc(s.domain) + '" target="_blank" rel="noopener">' + esc(s.domain) + '</a></td>'
      + '<td>' + esc(s.platform) + '</td><td>' + esc(s.country) + '</td><td>' + esc(s.category) + '</td>'
      + '<td>' + contact + '</td><td>' + signals + '</td>'
      + '<td><a href="' + AUDIT_URL + encodeURIComponent(s.domain) + '" target="_blank" rel="noopener">Audit</a></td></tr>';
  }).join('');
}
async function exportCsv() {
  $('export').disabled = true;
  try {
    const r = await fetch('/api/export?' + params(), { headers: { 'x-access-key': keyInput.value } });
    if (!r.ok) throw new Error((await r.json()).error || 'Export failed.');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob()); a.download = 'stores.csv'; a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { setMsg(e.message, true); }
  $('export').disabled = false;
}
$('search').onclick = () => run(1);
$('prev').onclick = () => run(page - 1);
$('next').onclick = () => run(page + 1);
$('export').onclick = exportCsv;
$('reset').onclick = () => {
  for (const id in ms) { ms[id].inc.clear(); ms[id].exc.clear(); drawMS(id); }
  document.querySelectorAll('aside input[type=text], aside input[type=number], aside select').forEach((el) => { if (!el.classList.contains('srch')) el.value = ''; });
  document.querySelectorAll('aside input[type=checkbox]').forEach((el) => { if (!el.dataset.v) el.checked = false; });
};
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(1); });

loadFilters();
if (keyInput.value) run(1);
</script>
</body>
</html>
